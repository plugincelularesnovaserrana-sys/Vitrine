<style>
  :root{
    --papel:#F4F4F6; --card:#FFFFFF; --tinta:#16181D; --tinta-2:#5E6470; --linha:#E3E5EA;
    --preco:#1B3FE0; --zap:#17A34A; --zap-hover:#128A3D; --foto-bg:#F0F1F4; --aba:#1E2133;
    --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
    --texto:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{ --papel:#0E1015; --card:#171A21; --tinta:#EEF0F4; --tinta-2:#9AA0AD; --linha:#262A33;
           --preco:#8AA2FF; --foto-bg:#1F232C; --aba:#EEF0F4; }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--texto);line-height:1.4}
  :focus-visible{outline:3px solid var(--preco);outline-offset:2px}

  /* Cabeçalho da loja */
  .loja{max-width:1180px;margin:0 auto;padding:20px 16px 8px;display:flex;gap:14px;align-items:center}
  .logo{flex:none;width:68px;height:68px;border-radius:50%;background:var(--aba);color:var(--papel);display:grid;place-items:center;overflow:hidden;font-family:var(--display);font-weight:800;font-size:1.6rem}
  .logo img{width:100%;height:100%;object-fit:cover}
  .loja h1{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,4vw,2rem);letter-spacing:-.02em;line-height:1.05;margin:0 0 4px}
  .loja p{margin:0;color:var(--tinta-2);font-size:.9rem}
  .loja a{color:inherit}
  .selos{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;overflow-x:auto}
  .selos span{flex:none;background:var(--card);border:1px solid var(--linha);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.85rem}

  /* Busca e abas */
  .barra{position:sticky;top:0;z-index:5;background:var(--papel);padding:8px 0 0;border-bottom:1px solid var(--linha)}
  .barra-in{max-width:1180px;margin:0 auto;padding:0 16px}
  .busca{width:100%;padding:12px 16px;border:1px solid var(--linha);border-radius:12px;background:var(--card);color:var(--tinta);font:inherit}
  .abas{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
  .abas button{flex:none;border:1px solid var(--linha);background:var(--card);color:var(--tinta);padding:8px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
  .abas button[aria-pressed="true"]{background:var(--aba);color:var(--papel);border-color:var(--aba)}

  .aviso{max-width:1180px;margin:0 auto;padding:10px 16px 0;font-size:.85rem;color:var(--tinta-2)}

  /* Grade */
  .grade{max-width:1180px;margin:0 auto;padding:12px 16px 90px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
  .item{background:var(--card);border:1px solid var(--linha);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}

  /* Carrossel de fotos */
  .foto{position:relative;aspect-ratio:1/1;overflow:hidden;background:#fff}
  .trilho{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .trilho::-webkit-scrollbar{display:none}
  .slide{position:relative;flex:0 0 100%;min-width:0;overflow:hidden;scroll-snap-align:center}
  .slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10px}
  .slide img.ajustada{inset:auto;object-fit:fill;padding:0}
  .seta{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.85);color:#16181D;font-size:1.1rem;line-height:1;cursor:pointer;display:grid;place-items:center}
  .seta.ant{left:6px}.seta.prox{right:6px}
  .pontos{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px}
  .pontos i{width:6px;height:6px;border-radius:50%;background:var(--tinta);opacity:.25}
  .pontos i.on{opacity:.8}

  .corpo{padding:12px 12px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
  .modelo{font-family:var(--display);font-weight:700;font-size:1.02rem;line-height:1.15;margin:0}
  .detalhes{margin:0;color:var(--tinta-2);font-size:.82rem}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tag{background:var(--foto-bg);border-radius:6px;padding:2px 8px;font-size:.75rem;font-weight:700;display:inline-flex;align-items:center;gap:4px}
  .tag svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tag.bat{background:#E6F6EC;color:#0F6B33}
  .tag.bat.baixa{background:#FFF1D6;color:#8A5A00}
  @media (prefers-color-scheme:dark){.tag.bat{background:#12281B;color:#7BE0A1}.tag.bat.baixa{background:#33260B;color:#F2C26B}}
  .obs{margin:6px 0 0;font-size:.78rem;color:var(--tinta-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .avista{margin-top:8px;font-size:.78rem;color:var(--tinta-2);font-weight:600}
  .valor{font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,5.4vw,1.9rem);letter-spacing:-.03em;color:var(--preco);line-height:1}
  .parcelas{margin:8px 0 0;padding:0;list-style:none;font-size:.78rem;color:var(--tinta-2);display:grid;gap:1px}
  .parcelas b{color:var(--tinta);font-weight:600}
  .cores{display:flex;gap:5px;margin-top:8px;min-height:14px}
  .cores i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.2)}
  .quero{margin-top:auto;padding-top:12px}
  .quero a{display:flex;justify-content:center;align-items:center;gap:8px;background:var(--zap);color:#fff;text-decoration:none;font-weight:700;padding:11px 12px;border-radius:10px;transition:background .15s}
  .quero a:hover{background:var(--zap-hover)}
  .quero svg,.flutuante svg{width:20px;height:20px;fill:currentColor}
  .vazio{grid-column:1/-1;text-align:center;color:var(--tinta-2);padding:48px 16px}

  /* Botão flutuante */
  .flutuante{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--zap);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
  .flutuante svg{width:30px;height:30px}

  .sistema{max-width:1180px;margin:0 auto;padding:8px 16px 48px}
  .sistema h2{font-family:var(--display);font-size:1.5rem;letter-spacing:-.02em;margin:0 0 12px}
  .sistema iframe{width:100%;height:640px;border:1px solid var(--linha);border-radius:14px;background:var(--card)}
  .rodape{border-top:1px solid var(--linha);padding:20px 16px;text-align:center;color:var(--tinta-2);font-size:.85rem}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script>
/* ============ CONFIGURAÇÃO ============ */
const CONFIG = {
  loja: "Plugin Celulares",
  slogan: "Aparelhos com garantia",
  instagram: "",                  // ex.: "@minhaloja" (opcional)
  cidade: "",                     // ex.: "Nova Serrana - MG" (opcional)
  selos: ["Pronta entrega"],      // etiquetas abaixo do nome (ex.: "Envia Brasil")
  logo: "LOGO.png",               // arquivo dentro de assets/ (se não existir, usa a inicial da loja)
  whatsapp: "5537991385331",      // DDI + DDD + número, só dígitos
  pastaMidias: "assets/",
  listaUrl: "https://raw.githubusercontent.com/plugincelularesnovaserrana-sys/Vitrine/main/produtos.json",                   // endereço da lista dos clientes (JSON ou texto). Vazio = demonstração
  token: "",                      // use um token só de leitura
  tokenModo: "query",             // "query" (?token=) ou "header" (Authorization: Bearer)
  sistemaUrl: "",                 // sistema a embutir (vazio = seção oculta)
  sistemaTitulo: "Nosso sistema",
  boletoMax: 15,                  // só para a etiqueta do cabeçalho
  cartaoMax: 18                   // cartão aparece só no cabeçalho
};

/* ============ DEMONSTRAÇÃO ============ */
const DEMO = [
  {modelo:"iPhone 13", detalhes:"128GB", condicao:"Seminovo", preco:2890, cores:"Meia-noite", bateria:89, observacao:"Pequeno risco na lateral", boleto:{entrada:600, parcelas:15, parcela:215}},
  {modelo:"iPhone 14 Pro", detalhes:"256GB", condicao:"Seminovo", preco:4290, cores:"Preto", bateria:92, boleto:{entrada:900, parcelas:15, parcela:320}},
  {modelo:"Galaxy A55", detalhes:"256GB", condicao:"Novo", preco:1990, fotos:"a55.jpg", cores:"Azul"},
  {modelo:"Redmi Note 14", detalhes:"256GB", condicao:"Novo", preco:1390, fotos:"note14.jpg", cores:"Preto", observacao:"Lacrado com nota fiscal"},
  {modelo:"Galaxy S22", detalhes:"128GB", condicao:"Seminovo", preco:1750, fotos:"s22.jpg", cores:"Verde", observacao:"Tela original, sem marcas de uso"}
];

/* ============ UTILITÁRIOS ============ */
const $ = id => document.getElementById(id);
const brl = n => n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const semFoto = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect x="38" y="14" width="44" height="92" rx="8" fill="none" stroke="#9aa0ad" stroke-width="3"/><circle cx="60" cy="94" r="3" fill="#9aa0ad"/></svg>');
const ICONE_ZAP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.5A10 10 0 1 0 12 2zm5.2 13.9c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.4-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2 1.3 2.3 1.4.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg>';

const ICONE_BAT = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2"/></svg>';

const MAPA_CORES = {
  "preto":"#1c1c1e","branco":"#f5f5f0","azul":"#3b6fd8","rosa":"#f4b8c8","verde":"#4f7a5a","amarelo":"#f2d86b",
  "vermelho":"#c8332f","roxo":"#8b6bc9","dourado":"#d9bf94","prata":"#d5d7db","cinza":"#8e9096","laranja":"#e8873a",
  "meia-noite":"#232a35","estelar":"#e6e0d4","ultramarino":"#6a6bf0","titânio natural":"#b9ad9d","titânio azul":"#4b5468",
  "titânio preto":"#3a3a3c","titânio branco":"#e4e2dc","titanio natural":"#b9ad9d","titanio azul":"#4b5468",
  "titanio preto":"#3a3a3c","titanio branco":"#e4e2dc"
};

function paraNumero(v){
  if (typeof v === "number") return v;
  let s = String(v ?? "").replace(/[^\d,.-]/g,"");
  if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
const lista = v => Array.isArray(v) ? v.map(String) : String(v ?? "").split(",").map(x => x.trim()).filter(Boolean);

const rotuloCond = c => {
  const k = String(c || "").trim().toLowerCase();
  if (["novo","novos","lacrado","lacrados"].includes(k)) return "Novo";
  if (["seminovo","seminovos","usado"].includes(k)) return "Seminovo";
  return String(c || "").trim();
};
const plural = c => c === "Novo" ? "Novos" : c === "Seminovo" ? "Seminovos" : c;

// Fotos: se o aparelho não trouxer fotos, usa assets/<modelo em minúsculas>.png
// (ex.: "iPhone 13 Pro Max" -> "iphone 13 pro max.png"). Nome sem extensão ganha .png.
const arquivoDoModelo = m => m.toLowerCase().replace(/\s+/g, " ").trim() + ".png";
function fotosDe(valor, modelo){
  const l = lista(valor).map(f => /\.[a-z0-9]{3,4}$/i.test(f) || /^(https?:|data:|\/)/.test(f) ? f : f + ".png");
  return l.length ? l : (modelo ? [arquivoDoModelo(modelo)] : []);
}

// boleto a prazo já calculado no admin: {entrada, parcelas, parcela}
function lerBoleto(b){
  if (!b || typeof b !== "object") return null;
  const parcela = paraNumero(b.parcela), parcelas = parseInt(b.parcelas, 10), entrada = paraNumero(b.entrada);
  return parcela > 0 && parcelas > 0 ? {entrada: entrada > 0 ? entrada : 0, parcelas, parcela} : null;
}

function normalizar(p){
  const nd = String(p.disponivel ?? "").toLowerCase();
  const modelo = String(p.modelo ?? p.nome ?? "").trim();
  const cond = rotuloCond(p.condicao ?? p.condição);
  const familia = String(p.familia ?? "").trim() || (/^iphone/i.test(modelo) ? "iPhone" : "Android");
  const bat = Math.round(paraNumero(p.bateria));
  return {
    familia,
    grupo: (familia + " " + plural(cond)).trim(),
    modelo,
    detalhes: String(p.detalhes ?? p.descricao ?? "").trim(),
    condicao: cond,
    preco: paraNumero(p.preco ?? p.avista),
    parcelado: p.parcelado ? paraNumero(p.parcelado) : null,
    bateria: bat >= 1 && bat <= 100 ? bat : null,
    observacao: String(p.observacao ?? p.obs ?? "").trim(),
    boleto: lerBoleto(p.boleto),
    fotos: fotosDe(p.fotos ?? p.foto, modelo),
    cores: lista(p.cores),
    disponivel: !(p.disponivel === false || nd === "nao" || nd === "não")
  };
}

// JSON (lista ou {produtos:[...]}) ou texto, uma linha por aparelho:
// modelo | detalhes | condição | preço | foto1,foto2 | cor1,cor2 | bateria | observação
function lerLista(texto){
  const t = texto.trim();
  if (t.startsWith("[") || t.startsWith("{")){
    const j = JSON.parse(t);
    return (Array.isArray(j) ? j : (j.produtos || j.items || [])).map(normalizar);
  }
  return t.split(/\r?\n/).filter(l => l.trim() && !l.trim().startsWith("#")).map(l => {
    const c = l.split("|").map(x => x.trim());
    return normalizar({modelo:c[0], detalhes:c[1], condicao:c[2], preco:c[3], fotos:c[4], cores:c[5], bateria:c[6], observacao:c[7]});
  });
}

async function carregar(){
  if (!CONFIG.listaUrl){
    $("aviso").hidden = false;
    $("aviso").textContent = "Modo demonstração: defina CONFIG.listaUrl para carregar a lista real.";
    return DEMO.map(normalizar);
  }
  const headers = {};
  let url = CONFIG.listaUrl;
  if (CONFIG.token){
    if (CONFIG.tokenModo === "header") headers.Authorization = "Bearer " + CONFIG.token;
    else url += (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(CONFIG.token);
  }
  const r = await fetch(url, {headers, cache:"no-store"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return lerLista(await r.text());
}

/* ============ RENDERIZAÇÃO ============ */
let produtos = [], abaAtiva = "Todos os produtos";

const urlFoto = f => !f ? semFoto : (/^(https?:|data:|\/)/.test(f) ? f : CONFIG.pastaMidias + (f.includes("%") ? f : encodeURI(f)));
// Endereço das fotos no GitHub (mesma pasta da lista): usado se a foto não existir ao lado do index
const urlRemota = f => {
  if (!f || !CONFIG.listaUrl || /^(https?:|data:|\/)/.test(f)) return "";
  return CONFIG.listaUrl.replace(/[^\/?#]*(\?.*)?$/, "") + CONFIG.pastaMidias + (f.includes("%") ? f : encodeURI(f));
};

function linkZap(texto){ return `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(texto)}`; }
function msgProduto(p){
  const extra = [p.detalhes, p.condicao, p.bateria ? `bateria ${p.bateria}%` : ""].filter(Boolean).join(", ");
  return `Olá! Tenho interesse no *${p.modelo}*${extra ? " (" + extra + ")" : ""} por ${brl(p.preco)} à vista. Ainda está disponível?`;
}

// Acha onde o aparelho está dentro da foto (ignora o fundo branco/transparente) e
// ajusta o zoom e a posição para todos os aparelhos ocuparem o mesmo espaço do quadrado.
function ajustarFoto(img){
  try {
    if (img.src.startsWith("data:")) return;
    const w = img.naturalWidth, h = img.naturalHeight; if (!w || !h) return;
    const s = 200 / Math.max(w, h), cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
    const c = document.createElement("canvas"); c.width = cw; c.height = ch;
    const ctx = c.getContext("2d", {willReadFrequently: true});
    ctx.drawImage(img, 0, 0, cw, ch);
    const d = ctx.getImageData(0, 0, cw, ch).data;
    const col = new Uint16Array(cw), lin = new Uint16Array(ch);
    for (let j = 0; j < ch; j++) for (let i = 0; i < cw; i++){
      const k = (j * cw + i) * 4;
      if (d[k + 3] > 20 && (d[k] < 238 || d[k + 1] < 238 || d[k + 2] < 238)){ col[i]++; lin[j]++; }
    }
    const primeiro = a => a.findIndex(v => v >= 2);
    const ultimo = a => { for (let i = a.length - 1; i >= 0; i--) if (a[i] >= 2) return i; return -1; };
    const x0 = primeiro(col), x1 = ultimo(col), y0 = primeiro(lin), y1 = ultimo(lin);
    if (x0 < 0 || y0 < 0 || x1 <= x0 || y1 <= y0) return;
    const bx = x0 / cw, by = y0 / ch, bw = (x1 + 1 - x0) / cw, bh = (y1 + 1 - y0) / ch;
    if (bw < 0.1 || bh < 0.1) return;
    const a = w / h, T = 0.88;                                    // aparelho ocupa 88% do quadrado
    const W = T / Math.max(bw, bh / a), H = W / a;
    img.style.width = (W * 100) + "%"; img.style.height = (H * 100) + "%";
    img.style.left = ((0.5 - (bx + bw / 2) * W) * 100) + "%";
    img.style.top = ((0.5 - (by + bh / 2) * H) * 100) + "%";
    img.classList.add("ajustada");
  } catch (e) { /* foto local (file://) ou sem permissão: fica como está */ }
}

function carrossel(p){
  const wrap = document.createElement("div"); wrap.className = "foto";
  const trilho = document.createElement("div"); trilho.className = "trilho";
  const fotos = p.fotos.length ? p.fotos : [""];
  fotos.forEach(f => {
    const slide = document.createElement("div"); slide.className = "slide";
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = p.modelo;
    // tenta: foto local (com e sem permissão de medir) e depois a foto no GitHub
    const tent = [[urlFoto(f), true], [urlFoto(f), false]];
    const rem = urlRemota(f);
    if (rem && rem !== urlFoto(f)) tent.push([rem, true], [rem, false]);
    let k = 0;
    const tentar = () => {
      if (k >= tent.length){ img.onerror = null; img.src = semFoto; return; }
      const [src, cors] = tent[k++];
      if (cors) img.crossOrigin = "anonymous"; else img.removeAttribute("crossorigin");
      img.src = src;
    };
    img.onload = () => ajustarFoto(img);
    img.onerror = tentar;
    tentar();
    slide.append(img); trilho.append(slide);
  });
  wrap.append(trilho);
  if (fotos.length > 1){
    const mk = (cls, txt, rotulo, dir) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "seta " + cls; b.textContent = txt; b.setAttribute("aria-label", rotulo);
      b.onclick = () => trilho.scrollBy({left: dir * trilho.clientWidth, behavior:"smooth"});
      return b;
    };
    const pontos = document.createElement("div"); pontos.className = "pontos";
    fotos.forEach(() => pontos.append(document.createElement("i")));
    const marcar = () => {
      const i = Math.round(trilho.scrollLeft / trilho.clientWidth);
      [...pontos.children].forEach((d, k) => d.classList.toggle("on", k === i));
    };
    trilho.addEventListener("scroll", marcar, {passive:true}); marcar();
    wrap.append(mk("ant","‹","Foto anterior",-1), mk("prox","›","Próxima foto",1), pontos);
  }
  return wrap;
}

function linhaBoleto(p){
  const b = p.boleto;
  if (!b) return null;                    // sem boleto cadastrado: mostra só o à vista
  const li = document.createElement("li");
  li.append("Boleto: ");
  if (b.entrada > 0){
    const e = document.createElement("b"); e.textContent = "entrada " + brl(b.entrada);
    li.append(e, " + ");
  }
  const x = document.createElement("b"); x.textContent = `${b.parcelas}x de ${brl(b.parcela)}`;
  li.append(x);
  li.title = `Total a prazo: ${brl(b.entrada + b.parcela * b.parcelas)}`;
  return li;
}

function cartao(p){
  const art = document.createElement("article"); art.className = "item";
  const c = document.createElement("div"); c.className = "corpo";

  const h = document.createElement("h2"); h.className = "modelo"; h.textContent = p.modelo;
  c.append(h);
  if (p.detalhes){ const d = document.createElement("p"); d.className = "detalhes"; d.textContent = p.detalhes; c.append(d); }
  const tags = document.createElement("div"); tags.className = "tags";
  if (p.condicao){ const s = document.createElement("span"); s.className = "tag"; s.textContent = p.condicao; tags.append(s); }
  if (p.bateria){
    const b = document.createElement("span"); b.className = "tag bat" + (p.bateria < 80 ? " baixa" : "");
    b.innerHTML = ICONE_BAT; b.append(`Bateria ${p.bateria}%`); tags.append(b);
  }
  if (tags.children.length) c.append(tags);
  if (p.observacao){ const o = document.createElement("p"); o.className = "obs"; o.textContent = "Obs: " + p.observacao; o.title = p.observacao; c.append(o); }

  const lb = document.createElement("div"); lb.className = "avista"; lb.textContent = "À vista";
  const v = document.createElement("div"); v.className = "valor"; v.textContent = brl(p.preco);
  const ul = document.createElement("ul"); ul.className = "parcelas";
  const bol = linhaBoleto(p);
  if (bol){ ul.append(bol); c.append(lb, v, ul); } else c.append(lb, v);

  if (p.cores.length){
    const cs = document.createElement("div"); cs.className = "cores";
    p.cores.forEach(nome => {
      const i = document.createElement("i");
      i.title = nome; i.style.background = MAPA_CORES[nome.toLowerCase()] || "#b8bcc6";
      cs.append(i);
    });
    c.append(cs);
  }

  const q = document.createElement("div"); q.className = "quero";
  const a = document.createElement("a");
  a.href = linkZap(msgProduto(p)); a.target = "_blank"; a.rel = "noopener";
  a.innerHTML = ICONE_ZAP; a.append("Quero este");
  q.append(a); c.append(q);

  art.append(carrossel(p), c);
  return art;
}

function desenhar(){
  const termo = $("busca").value.trim().toLowerCase();
  const grade = $("grade"); grade.replaceChildren();
  const itens = produtos.filter(p =>
    p.disponivel &&
    (abaAtiva === "Todos os produtos" || p.grupo === abaAtiva) &&
    (!termo || (p.modelo + " " + p.detalhes).toLowerCase().includes(termo)));
  if (!itens.length){
    const e = document.createElement("div"); e.className = "vazio";
    e.textContent = produtos.length ? "Nenhum aparelho encontrado. Tente outra busca." : "Lista indisponível no momento. Chame a gente no WhatsApp.";
    grade.append(e); return;
  }
  itens.forEach(p => grade.append(cartao(p)));
}

function desenharAbas(){
  const ordem = ["iPhone Seminovos","Android Novos","Android Seminovos"];
  const grupos = [...new Set(produtos.filter(p => p.disponivel).map(p => p.grupo).filter(Boolean))]
    .sort((a,b) => (ordem.indexOf(a) + 1 || 99) - (ordem.indexOf(b) + 1 || 99));
  const nav = $("abas"); nav.replaceChildren();
  ["Todos os produtos", ...grupos].forEach(m => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = m; b.setAttribute("aria-pressed", m === abaAtiva);
    b.onclick = () => { abaAtiva = m; desenharAbas(); desenhar(); };
    nav.append(b);
  });
}

function montarCabecalho(){
  $("nomeLoja").textContent = CONFIG.loja;
  document.title = CONFIG.loja + " · Aparelhos disponíveis";
  $("slogan").textContent = CONFIG.slogan;
  $("contato").textContent = [CONFIG.instagram, CONFIG.cidade].filter(Boolean).join(" · ");
  $("contato").hidden = !$("contato").textContent;

  const logo = $("logo"); logo.textContent = (CONFIG.loja[0] || "L").toUpperCase();
  if (CONFIG.logo){
    const img = new Image(); img.alt = CONFIG.loja;
    img.onload = () => logo.replaceChildren(img);
    img.src = urlFoto(CONFIG.logo);
  }
  const selos = $("selos");
  CONFIG.selos.forEach(t => { const s = document.createElement("span"); s.textContent = t; selos.append(s); });
  const pg = document.createElement("span"); pg.textContent = `Boleto até ${CONFIG.boletoMax}x`;
  const pc = document.createElement("span"); pc.textContent = `Cartão até ${CONFIG.cartaoMax}x`;
  selos.append(pg, pc);

  const z = $("zapFlutuante");
  z.innerHTML = ICONE_ZAP;
  z.href = linkZap("Olá! Vim pela vitrine e quero tirar uma dúvida.");
}

/* ============ INICIAR ============ */
(async function(){
  montarCabecalho();
  $("busca").addEventListener("input", desenhar);
  if (CONFIG.sistemaUrl){
    $("sistemaTitulo").textContent = CONFIG.sistemaTitulo;
    $("sistemaFrame").src = CONFIG.sistemaUrl;
    $("sistemaBox").hidden = false;
  }
  try { produtos = await carregar(); }
  catch (e) { console.error("Falha ao carregar a lista:", e); produtos = []; }
  desenharAbas(); desenhar();
})();
</script>
